<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vizcachon</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#111827;color:#f9fafb;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(760px,100%)}h1{margin:0 0 8px;font-size:clamp(2rem,7vw,4.5rem);text-align:center}p{margin:0 0 24px;text-align:center;color:#cbd5e1}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.pad{min-height:120px;border:1px solid #334155;border-radius:18px;background:#1e293b;color:#fff;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer;padding:18px;display:flex;align-items:center;gap:14px;text-align:left}.pad:active,.pad.playing{transform:scale(.98);background:#334155}.num{display:grid;place-items:center;width:44px;height:44px;border-radius:999px;background:#0f172a;flex:0 0 auto}.controls{margin-top:18px;padding:16px;border:1px solid #334155;border-radius:18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}.stop{border:0;border-radius:12px;padding:13px 20px;font-weight:900;background:#ef4444;color:white;cursor:pointer}label{display:flex;gap:10px;align-items:center;flex:1;min-width:220px}input{width:100%}#status{color:#cbd5e1}@media(max-width:560px){.grid{grid-template-columns:1fr}.pad{min-height:92px}}</style></head><body><main><h1>🎛️ Vizcachon</h1><p>Audios OGG originales, sin procesamiento ni recompresión.</p><div class="grid"><button class="pad" data-n="1"><span class="num">1</span>Audio 1</button><button class="pad" data-n="2"><span class="num">2</span>Audio 2</button><button class="pad" data-n="3"><span class="num">3</span>Audio 3</button><button class="pad" data-n="4"><span class="num">4</span>Audio 4</button><button class="pad" data-n="5"><span class="num">5</span>Audio 5</button><button class="pad" data-n="6"><span class="num">6</span>Audio 6</button></div><div class="controls"><button class="stop" id="stop">■ STOP</button><label>Volumen <input id="vol" type="range" min="0" max="1" step="0.01" value="1"></label><span id="status">Cargando audios…</span></div></main><script>const pads=[...document.querySelectorAll('.pad')],status=document.querySelector('#status'),vol=document.querySelector('#vol'),audios={};function b64Blob(s){const x=atob(s.trim()),a=new Uint8Array(x.length);for(let i=0;i<x.length;i++)a[i]=x.charCodeAt(i);return URL.createObjectURL(new Blob([a],{type:'audio/ogg'}))}async function load(){try{await Promise.all([1,2,3,4,5,6].map(async n=>{const t=await fetch('audio'+n+'.b64').then(r=>{if(!r.ok)throw Error();return r.text()});const a=new Audio(b64Blob(t));a.preload='auto';audios[n]=a}));status.textContent='Listo'}catch(e){status.textContent='Error cargando audios'}}function stopAll(){Object.values(audios).forEach(a=>{a.pause();a.currentTime=0});pads.forEach(b=>b.classList.remove('playing'));status.textContent='Detenido'}async function play(n,b){stopAll();const a=audios[n];if(!a){status.textContent='Audio todavía cargando';return}a.volume=Number(vol.value);try{await a.play();b.classList.add('playing');status.textContent='Reproduciendo Audio '+n;a.onended=()=>{b.classList.remove('playing');status.textContent='Listo'}}catch(e){status.textContent='El navegador bloqueó la reproducción'}}pads.forEach(b=>b.onclick=()=>play(b.dataset.n,b));document.querySelector('#stop').onclick=stopAll;vol.oninput=()=>Object.values(audios).forEach(a=>a.volume=Number(vol.value));document.addEventListener('keydown',e=>{if(e.key==='Escape')stopAll();if(/^[1-6]$/.test(e.key))pads[Number(e.key)-1].click()});load();</script></body></html>
